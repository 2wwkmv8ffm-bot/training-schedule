<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    // 🔍 화면 확대: 두 번 탭 확대는 항상 끄고, 두 손가락 확대(핀치)는 나 탭에서 켜고 끌 수 있어요 (기본: 끔)
    (function () {
      var on = false;
      try { on = localStorage.getItem("training.zoom") === "1"; } catch (e) {}
      function apply() {
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute("content", on ? "width=device-width, initial-scale=1, viewport-fit=cover" : "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
      }
      apply();
      // 아이폰은 user-scalable=no를 무시할 때가 있어서, 끈 상태면 두 손가락 동작도 막아요
      document.addEventListener("gesturestart", function (e) { if (!on) e.preventDefault(); }, { passive: false });
      document.addEventListener("touchmove", function (e) { if (!on && e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
      // 📲 앱 설치: 갤럭시(안드로이드)는 설치 버튼, 아이폰은 '홈 화면에 추가' 안내
      var deferred = null;
      window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
      if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
      window.ZONE_INSTALL = function () {
        var ua = navigator.userAgent, standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
        if (standalone) { alert("이미 앱으로 설치되어 있어요 👍"); return; }
        if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; }); return; }
        if (/iPhone|iPad|iPod/.test(ua)) alert("아이폰에 설치하는 법\n\n1. 사파리로 이 사이트를 열어요 (카톡·네이버 앱 안에서는 안 돼요)\n2. 아래 가운데 공유 버튼(□↑)을 눌러요\n3. '홈 화면에 추가'를 누르고 '추가'\n\n홈 화면의 ZONE 아이콘으로 열면 앱처럼 써요.");
        else if (/SamsungBrowser/.test(ua)) alert("갤럭시(삼성 인터넷)에 설치하는 법\n\n1. 아래 오른쪽 ☰ 메뉴를 눌러요\n2. '현재 페이지 추가' → '홈 화면'\n\n홈 화면의 ZONE 아이콘으로 열면 앱처럼 써요.");
        else if (/Android/.test(ua)) alert("갤럭시(크롬)에 설치하는 법\n\n1. 오른쪽 위 ⋮ 메뉴를 눌러요\n2. '앱 설치' 또는 '홈 화면에 추가'\n\n홈 화면의 ZONE 아이콘으로 열면 앱처럼 써요.");
        else alert("휴대폰에서 이 사이트를 열고 '홈 화면에 추가'를 하면 앱처럼 쓸 수 있어요.\n(아이폰: 사파리 공유 버튼 · 갤럭시: 크롬 ⋮ 메뉴)");
      };
      window.ZONE_ZOOM = { get: function () { return on; }, set: function (v) { on = !!v; try { localStorage.setItem("training.zoom", on ? "1" : "0"); } catch (e) {} apply(); } };
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fc;
      --panel: #ffffff;
      --panel2: #eef3fb;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --hover: #c7d2fe;
      --accent: #1d6bf3;
      --accent2: #38bdf8;
      --accent-soft: rgba(29, 107, 243, .10);
      --shadow: rgba(29, 107, 243, .30);
      --done: #16a34a;
      --danger: #e11d48;
      --today: rgba(29, 107, 243, .05);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; } /* 두 번 탭해도 화면이 커지지 않게 */
    button, a, input, select, textarea, label { touch-action: manipulation; }
    body { font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; -webkit-tap-highlight-color: transparent; }
    .num { font-family: "Barlow Condensed", "Noto Sans KR", sans-serif; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
    .app { max-width: 640px; margin: 0 auto; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }
    .tab { display: none; }
    .tab.show { display: block; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 14px; }
    .brand { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-style: italic; font-size: 32px; letter-spacing: 3px; }
    .brand i { color: var(--accent); font-style: italic; }
    h1.big { font-size: 34px; font-weight: 900; margin: 0; letter-spacing: -1px; }
    h2 { font-size: 22px; margin: 0 0 6px; }

    button {
      font: inherit; font-size: 16px; color: var(--text); background: var(--panel2); /* 16px 미만이면 아이폰이 입력할 때 화면을 확대해요 */ border: 1px solid var(--line);
      border-radius: 12px; padding: 9px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--hover); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button.primary:hover { background: #1559d6; }
    button.white { background: var(--text); border-color: var(--text); color: #fff; font-weight: 800; }
    button.danger { color: var(--danger); }
    button.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; }
    .pill { border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; }
    .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cmsg { max-width: 85%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
    .cmsg.me { justify-self: end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .cmsg.ai { justify-self: start; background: var(--soft, #eef2f7); border-bottom-left-radius: 4px; }
    .coach-card { background: linear-gradient(135deg, rgba(29,107,243,.07), rgba(56,189,248,.07)); }
    .icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; }
    input, select, textarea {
      font: inherit; font-size: 16px; color: var(--text); background: var(--panel2); /* 16px 미만이면 아이폰이 입력할 때 화면을 확대해요 */
      border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    input[type="range"] { padding: 0; accent-color: var(--accent); background: none; border: 0; }
    label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, .04); }
    .card h3 { margin: 0 0 10px; font-size: 15px; }
    .eyebrow { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .4px; margin-bottom: 6px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; line-height: 1.6; }
    .warn { color: var(--danger); font-size: 14px; min-height: 1em; }
    .note { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-top: 10px; }
    .note code, .banner code { background: rgba(15, 23, 42, .06); padding: 1px 5px; border-radius: 4px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mt { margin-top: 16px !important; }
    .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; }

    /* ---- 하단 탭 ---- */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: rgba(255, 255, 255, .95); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; align-items: flex-end;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 8px; min-width: 56px; }
    .tabbar button.on { color: var(--accent); font-weight: 700; }
    .tabbar svg { width: 24px; height: 24px; }
    .tabbar .rec {
      width: 62px; height: 62px; min-width: 0; border-radius: 50%; background: var(--accent); color: #fff;
      margin-top: -28px; box-shadow: 0 8px 24px var(--shadow); display: grid; place-items: center; padding: 0;
    }
    .tabbar .rec svg { width: 28px; height: 28px; }

    /* ---- 계획(달력) 탭 ---- */
    .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .dot.ok { background: var(--done); }
    .dot.err { background: var(--danger); }
    .plan-cta { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 14px; }
    .plan-cta .primary { padding: 13px; font-size: 15px; }
    .weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .range { flex: 1; text-align: center; font-weight: 700; }
    .banner { background: var(--panel); border: 1px solid var(--danger); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: none; line-height: 1.6; font-size: 14px; }
    .banner.show { display: block; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .stat b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 28px; font-weight: 800; }
    .stat span { font-size: 12px; color: var(--muted); }
    .week { display: grid; gap: 10px; }
    .day { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .day.today { border-color: var(--accent); background: linear-gradient(var(--today), var(--today)), var(--panel); }
    .day-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-weight: 700; font-size: 14px; }
    .day-head .sun { color: #e11d48; }
    .day-head .sat { color: var(--accent); }
    .day-head button { padding: 2px 10px; font-size: 14px; border-radius: 999px; }
    .items { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
    .item { border-radius: 10px; border-left: 4px solid var(--accent); padding: 8px 10px; cursor: pointer; background: var(--panel2); font-size: 14px; }
    .item.done { opacity: .55; border-left-color: var(--done); }
    .item.done .t { text-decoration: line-through; }
    .item .row { flex-wrap: nowrap; align-items: flex-start; }
    .item input { width: auto; margin: 3px 0 0; accent-color: var(--accent); }
    .item .t { font-weight: 700; word-break: break-word; }
    .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .empty { color: var(--muted); font-size: 12px; padding: 0 2px 4px; }
    /* 월간 캘린더 */
    .mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; margin-bottom: 10px; }
    .mh { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .mh.sun, .mc .mn.sun { color: #e11d48; }
    .mh.sat, .mc .mn.sat { color: var(--accent); }
    .mc { min-height: 64px; padding: 3px; border-radius: 8px; border: 1px solid transparent; background: none; display: flex; flex-direction: column; gap: 2px; align-items: stretch; text-align: left; min-width: 0; overflow: hidden; }
    .mc:hover { background: var(--panel2); }
    .mc.out { opacity: .35; }
    .mc.today .mn { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; align-self: flex-start; }
    .mc.sel { border-color: var(--accent); background: var(--accent-soft); }
    .mc .mn { font-size: 12px; font-weight: 700; line-height: 18px; }
    .mc i { display: block; font-style: normal; font-size: 9.5px; line-height: 14px; color: #fff; border-radius: 3px; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mc i.dn { color: #475569; text-decoration: line-through; }
    .mc em { font-style: normal; font-size: 10px; color: var(--muted); }
    @media (min-width: 560px) { .mc { min-height: 84px; } .mc i { font-size: 11px; line-height: 16px; } }

    /* ---- 대화상자 ---- */
    dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--text); padding: 0; width: min(460px, calc(100vw - 24px)); }
    dialog::backdrop { background: rgba(15, 23, 42, .4); }
    dialog form { padding: 18px; display: grid; gap: 12px; }
    dialog h2 { margin: 0; font-size: 18px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check { display: flex; gap: 8px; align-items: center; color: var(--text); }
    .check input { width: auto; accent-color: var(--accent); }
    .actions { display: flex; gap: 8px; justify-content: space-between; }
    .actions .right { display: flex; gap: 8px; margin-left: auto; }

    /* ---- 전체 화면(설정·계획·기록·상세) ---- */
    .ov { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; display: none; }
    .ov.show { display: block; }
    #trackerOv { z-index: 45; }
    .ov-inner { max-width: 680px; margin: 0 auto; padding: 16px 16px 110px; }
    .wz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .wz-prog { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .wz-prog span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .ov-foot {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      background: var(--panel); border-top: 1px solid var(--line);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 8px;
    }
    .ov-foot button { padding: 12px 18px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .unit { display: flex; align-items: center; gap: 6px; }
    .unit span { color: var(--muted); font-size: 13px; white-space: nowrap; }
    [hidden] { display: none !important; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 999px; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .sport-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sport-card { display: grid; gap: 6px; justify-items: center; padding: 26px 10px; border: 2px solid var(--line); border-radius: 18px; background: var(--panel); }
    .sport-card:hover, .sport-card:focus-visible { border-color: var(--accent); outline: none; }
    .sport-card.selected { border-color: var(--accent); background: var(--accent-soft); }
    .sport-card .ico { font-size: 44px; line-height: 1; }
    .sport-card .nm { font-size: 19px; font-weight: 900; }
    .sport-card .ds { font-size: 12px; color: var(--muted); }
    .rec-head, .rec-row { display: grid; grid-template-columns: minmax(64px, 96px) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
    .rec-head { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .rec-row { margin-bottom: 6px; }
    .rec-lbl { font-size: 13px; font-weight: 500; }
    .rec-row input { padding: 7px; font-size: 14px; min-width: 0; }
    details.card summary { cursor: pointer; font-weight: 700; }
    details.card[open] summary { margin-bottom: 10px; }
    .race-row { display: grid; grid-template-columns: 2fr 1.4fr 1.6fr 1.1fr auto; gap: 6px; margin-bottom: 8px; align-items: center; }
    .race-row > * { min-width: 0; }
    @media (max-width: 640px) {
      .race-row { grid-template-columns: 1fr 1fr; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
    }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
    .kv > span { color: var(--muted); }
    .zt-wrap { overflow-x: auto; }
    .zt { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
    .zt th, .zt td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; line-height: 1.5; }
    .zt th { color: var(--muted); font-weight: 500; }
    .zguide { margin-top: 8px; padding: 8px 10px; border-left: 4px solid; border-radius: 8px; background: var(--panel2, #f8fafc); font-size: 13px; line-height: 1.6; }
    .zguide .link { padding: 0; margin-left: 4px; }
    .zone-btn { background: #fff1f2; border: 1px solid #fda4af; color: #e11d48; font-size: 13px; font-weight: 800; padding: 6px 14px; }
    .lv-btn { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; font-size: 13px; font-weight: 800; padding: 6px 14px; }
    .pw-wrap { position: relative; display: block; }
    .pw-wrap input { padding-right: 44px; }
    .pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: 0; font-size: 18px; padding: 6px 8px; cursor: pointer; }
    .nav-dot { position: absolute; top: 2px; right: 18%; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #ef4444; color: #fff; font-size: 10px; font-style: normal; font-weight: 800; line-height: 16px; text-align: center; }

    .mc i[data-sp] { position: relative; padding-left: 2px; border-left: 3px solid transparent; }
    .mc i[data-sp="swim"] { border-left-color: #0284c7; } .mc i[data-sp="bike"] { border-left-color: #7c3aed; } .mc i[data-sp="run"] { border-left-color: #0f172a; } .mc i[data-sp="brick"] { border-left-color: #db2777; }
    .mc i .si { margin-right: 1px; }
    .sp-tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; margin-bottom: 2px; color: #fff; }
    .sp-tag[data-sp="swim"], .sp-k[data-sp="swim"] { background: #0284c7; } .sp-tag[data-sp="bike"], .sp-k[data-sp="bike"] { background: #7c3aed; } .sp-tag[data-sp="run"], .sp-k[data-sp="run"] { background: #0f172a; } .sp-tag[data-sp="brick"], .sp-k[data-sp="brick"] { background: #db2777; }

    .txt-post .htag { color: #fde68a; }
    .post.ig .post-act { gap: 2px; padding-top: 4px; }
    .post.ig .post-act button.ic { border: 0; background: none; font-size: 24px; padding: 4px 8px; }
    .post.ig .post-act button.ic.on { background: none; }
    .post-act button.pop { animation: lp .35s ease; }
    @keyframes lp { 50% { transform: scale(1.35); } }
    .post-likes { font-size: 14px; margin: 2px 0 4px; }
    .post.ig .post-body { font-size: 14.5px; margin-bottom: 4px; }
    .htag { color: var(--accent); font-weight: 600; text-decoration: none; }
    .obadge { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 900; color: #fff; background: linear-gradient(135deg, #2563eb, #7c3aed); vertical-align: 2px; letter-spacing: .3px; }
    .fbadge { font-size: 12px; margin-left: 3px; vertical-align: 1px; } .fol-btn { font-size: 13px; font-weight: 700; color: var(--accent); padding: 0 4px; }
    .cm-more { display: block; padding: 2px 14px; color: var(--muted); font-size: 13.5px; }
    .post-time { font-size: 12px; margin-top: 2px; }
    .emo-row { display: flex; gap: 4px; } .emo-row button { border: 0; background: var(--panel2); border-radius: 10px; font-size: 20px; padding: 4px 8px; }
    .ex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 12px; }
    .ex-cell { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 4px; overflow: hidden; background: linear-gradient(135deg, #1d4ed8, #7c3aed); color: #fff; }
    .ex-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ex-txt { display: grid; place-items: center; height: 100%; padding: 8px; font-size: 13px; line-height: 1.3; text-align: center; gap: 2px; }
    .ex-txt b { font-size: 16px; }
    .ex-multi { position: absolute; top: 4px; right: 6px; font-style: normal; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    .ex-like { position: absolute; left: 6px; bottom: 4px; font-style: normal; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
    .ex-pin { position: absolute; left: 6px; top: 4px; font-style: normal; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    .ntag { margin-left: 2px; font-size: .82em; font-weight: 600; color: var(--muted, #64748b); }
    .pc-cam { width: 64px; height: 64px; margin-top: 6px; border-radius: 14px; font-size: 28px; padding: 0; border: 2px dashed var(--muted, #94a3b8); background: transparent; }
    .com-fr { margin-left: 4px; padding: 6px 7px; white-space: nowrap; flex: none; font-size: 13px; }
    .com-seg { min-width: 0; }
    .com-seg button { padding-left: 4px; padding-right: 4px; }
    .jn-btn { width: 40px; height: 40px; padding: 0; border-radius: 10px; font-size: 22px; line-height: 1; display: inline-grid; place-items: center; vertical-align: middle; }
    .prof-hd { display: flex; gap: 14px; align-items: center; }
    .prof-st { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
    .prof-st b { display: block; font-size: 17px; } .prof-st span { font-size: 11px; color: var(--muted); }
    dialog.sheet-dlg { width: min(520px, calc(100vw - 16px)); }
    #storyDlg { padding: 0; border: 0; width: min(440px, 100vw); height: min(820px, 100dvh); max-height: 100dvh; background: #000; color: #fff; border-radius: 0; }
    #storyDlg::backdrop { background: #000; }
    .story-view { position: relative; height: 100%; display: flex; flex-direction: column; }
    .sv-bars { display: flex; gap: 3px; padding: 10px 10px 0; } .sv-bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); overflow: hidden; position: relative; }
    .sv-bars i.done { background: #fff; } .sv-bars i.run::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; animation: svb 5s linear forwards; }
    @keyframes svb { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .sv-hd { display: flex; gap: 8px; align-items: center; padding: 10px 12px; z-index: 2; } .sv-hd span { opacity: .7; font-size: 13px; }
    .sv-hd button { margin-left: auto; background: none; border: 0; color: #fff; font-size: 22px; }
    .sv-media { flex: 1; display: grid; place-items: center; overflow: hidden; } .sv-media img { width: 100%; height: 100%; object-fit: contain; }

    .sv-stats { display: flex; gap: 14px; font-size: 18px; font-weight: 800; }
    .sv-txt { position: absolute; left: 0; right: 0; bottom: 70px; padding: 12px 16px; background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 15px; z-index: 2; }
    .sv-chip { position: absolute; top: 70px; left: 12px; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 999px; font-size: 13px; z-index: 2; }
    .sv-nav { position: absolute; inset: 60px 0 70px; display: grid; grid-template-columns: 1fr 2fr; z-index: 1; } .sv-nav button { background: none; border: 0; }
    .sv-ft { display: flex; gap: 8px; padding: 12px; z-index: 2; } .sv-ft button { flex: 1; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; padding: 10px; }

    .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

</head>
<body>
  <div class="app">
    <!-- 홈 -->
    <section class="tab show" id="tab-home">
      <header class="top">
        <div class="brand" data-home="1" style="cursor:pointer">Z<i>O</i>NE</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <button class="pill" id="sportBtn">종목 선택</button>
          <button type="button" class="pill zone-btn" data-zguide="0">❤️ 심박 존</button>
          <button type="button" class="pill lv-btn" onclick="window.TS && TS.openLevel && TS.openLevel()">🏅 레벨 기준표</button>
        </div>
      </header>
      <div id="homeBody"></div>
    </section>

    <!-- 계획 (주간 달력) -->

      <header class="top">

      <div class="plan-cta">

      </div>
      <div class="seg" id="viewSeg">
        <button type="button" data-view="week">주간</button>

      </div>
      <div class="weeknav">
        <button class="icon" id="prev" aria-label="이전">‹</button>
        <div class="range" id="range"></div>

      </div>
      <div class="banner" id="banner"></div>
      <div class="summary">
        <div class="stat"><b id="sCount">0</b><span>이번 주 훈련</span></div>
        <div class="stat"><b id="sDone">0</b><span>완료</span></div>
        <div class="stat"><b id="sMin">0분</b><span>총 훈련 시간</span></div>

    <!-- 나 (프로필·기록·배지) -->

      <header class="top"><h1 class="big">나</h1></header>
      <div id="meBody"></div>

  <nav class="tabbar">

    </button>

  <!-- 훈련 일정 추가·수정 -->
  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="formTitle">훈련 추가</h2>
      <label>훈련 이름
        <input name="title" required maxlength="100" placeholder="예: 인터벌 러닝" />
      </label>
      <div class="two">
        <label>날짜 <input type="date" name="date" required /></label>
        <label>시작 시간 <input type="time" name="start_time" /></label>
      </div>
      <div class="two">
        <label>종류 <select name="category"></select></label>
        <label>시간(분) <input type="number" name="duration_min" min="0" step="5" placeholder="60" /></label>
      </div>
      <label>강도
        <select name="intensity">
          <option value="">선택 안 함</option><option>낮음</option><option>보통</option><option>높음</option>
        </select>
      </label>
      <label>메모 <textarea name="notes" rows="8" placeholder="세트, 거리, 페이스 등"></textarea></label>
      <label class="check"><input type="checkbox" name="completed" /> 완료함</label>
      <div class="actions">
        <button type="button" class="danger" id="del">삭제</button>
        <div class="right">
          <button type="button" id="cancel">취소</button>
          <button type="submit" class="primary" id="save">저장</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- 직접 기록 (수영·실내 훈련 등 GPS 없이) -->
  <dialog id="manualDlg">
    <form id="manualForm" method="dialog">
      <h2>직접 기록하기</h2>
      <label>종목
        <select name="sport">
          <option value="run">🏃 달리기</option><option value="bike">🚴 자전거</option>
          <option value="swim">🏊 수영</option><option value="tri">🏅 철인3종 (한 번에)</option>
        </select>
      </label>
      <label>공개 범위
        <select name="vis"><option value="friends">👥 친구만</option><option value="public">🌏 전체 공개</option><option value="private">🔒 나만</option></select>
      </label>
      <label>제목 <input name="title" maxlength="100" placeholder="예: 트레드밀 인터벌" /></label>
      <div class="two">
        <label>날짜 <input type="date" name="date" required /></label>
        <label>시작 시간 <input type="time" name="time" /></label>
      </div>
      <div class="two">
        <label><span id="mDistLbl">거리 (km)</span> <input name="distance" inputmode="decimal" placeholder="예: 10" /></label>
        <label>운동 시간 <input name="duration" placeholder="예: 45:30 또는 1:05:00" required /></label>
      </div>
      <label>운동 자각도(RPE) <b id="mRpeV">5</b>
        <input type="range" name="rpe" min="1" max="10" value="5" />
      </label>
      <div class="hint" id="mRpeTxt"></div>
      <label>메모 <textarea name="notes" rows="3"></textarea></label>
      <div class="actions">
        <div class="right">
          <button type="button" id="mCancel">취소</button>
          <button type="submit" class="primary">저장</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- 스트라바 가져오기 -->
  <dialog id="stravaDlg"><div style="padding:18px;display:grid;gap:12px" id="stravaBody"></div></dialog>

  <!-- 커뮤니티 글쓰기 -->
  <dialog id="postDlg"><div style="padding:18px;display:grid;gap:12px" id="postBody"></div></dialog>

  <!-- 친구 관리 -->
  <dialog id="friendDlg"><div style="padding:18px;display:grid;gap:14px" id="friendBody"></div></dialog>

  <!-- 가민 기록 가져오기 -->
  <dialog id="importDlg"><div style="padding:18px;display:grid;gap:12px" id="importBody"></div></dialog>

  <!-- 처음 설정 (종목 → 신체 정보 → 일정 → 훈련량 → 기록·목표 → 대회 → 확인) -->
  <div class="ov" id="wizard">
    <div class="ov-inner">
      <div class="wz-top">
        <div class="wz-prog"><span id="wzBar"></span></div>
        <span class="hint" id="wzStep"></span>
        <button type="button" class="pill" data-home="1" id="wzHome">🏠 홈</button>
        <button type="button" id="wzClose">닫기</button>
      </div>
      <div id="wzBody"></div>
    </div>
    <div class="ov-foot">
      <button type="button" id="wzPrev">‹ 이전</button>
      <button type="button" class="primary" id="wzNext">다음 ›</button>
    </div>
  </div>

  <!-- 자동 훈련 계획 -->
  <div class="ov" id="planOv"><div class="ov-inner" id="planBody"></div></div>

  <!-- 활동 상세 -->
  <div class="ov" id="detailOv"><div class="ov-inner" id="detailBody"></div></div>

  <!-- GPS 기록 -->
  <div class="ov" id="trackerOv"></div>

  <!-- 로그인 · 회원가입 -->
  <div class="ov" id="authOv"><div class="ov-inner" id="authBody"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js?v=202611143200"></script>
  <script src="zones.js?v=202611143200"></script>
  <script src="app.js?v=202611143200"></script>
  <script src="engine.js?v=202611143200"></script>
  <script src="profile.js?v=202611143200"></script>
  <script src="garmin.js?v=202611143200"></script>
  <script src="tracker.js?v=202611143200"></script>
  <script src="hub.js?v=202611143200"></script>
  <script src="auth.js?v=202611143200"></script>
  <script src="community.js?v=202611143200"></script>
  <script src="strava.js?v=202611143200"></script>
  <script src="coach.js?v=202611143200"></script>
  <script src="predict.js?v=202611143200"></script>
  <script src="feedback.js?v=202611143200"></script>
  <script src="drills.js?v=202611143200"></script>
  <script src="journal.js?v=202611143200"></script>
  <script src="nav.js?v=202611143200"></script>
</body>
</html>
