<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZONE 앱에서 열기</title>
  <meta name="description" content="ZONE 앱을 열어 확인해 주세요." />
  <link rel="icon" href="icon-192.png" />
  <style>
    :root { --bg: #eef3fb; --card: #fff; --text: #0f172a; --muted: #5b6577; --accent: #1d5fe0; --line: #dbe3ef; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e131c; --card: #161e2b; --text: #e9eef7; --muted: #9aa6ba; --accent: #6d9cff; --line: #283348; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
    .hero { background: radial-gradient(900px 500px at 50% 0%, #3b82f6, #1d4ed8 55%, #0b1b4d); color: #fff; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 36px) 20px 52px; }
    .hero img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    .hero h1 { margin: 14px 0 6px; font-size: 23px; letter-spacing: -0.5px; }
    .hero p { margin: 0; opacity: .9; }
    main { max-width: 480px; margin: -30px auto 40px; padding: 0 16px; display: grid; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
    .btn { display: block; width: 100%; border-radius: 12px; padding: 13px; font-weight: 800; text-align: center; text-decoration: none; background: var(--accent); color: #fff; margin-top: 10px; }
    .muted { color: var(--muted); font-size: 14px; text-align: center; }
    .muted a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="hero">
    <img src="app-icon-1024.png" alt="ZONE" />
    <h1>ZONE 앱에서 확인해 주세요</h1>
    <p>쿠폰과 멤버십은 휴대폰의 ZONE 앱에 들어 있어요</p>
  </div>
  <main>
    <div class="card">
      <ol>
        <li>휴대폰 홈 화면에서 <b>ZONE 앱</b>을 열어요.</li>
        <li>아래 <b>나</b> 탭 → <b>🎟️ 내 쿠폰</b>으로 가요.</li>
        <li>쿠폰 옆 <b>사용하기</b>를 누르면 끝이에요.</li>
      </ol>
    </div>
    <div class="card">
      <p class="muted" style="margin:0">아직 앱이 없다면</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.zonetraining.app">갤럭시 · Google Play에서 받기</a>
      <p class="muted" style="margin:10px 0 0">아이폰은 App Store에서 <b>ZONE</b>을 검색해 주세요.</p>
    </div>
    <p class="muted">앱 없이 웹으로 보려면 <a href="index.html">여기</a>를 눌러 로그인해 주세요.</p>
  </main>
</body>
</html>
