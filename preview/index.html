<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    // 🔍 화면 확대: 두 번 탭 확대는 항상 끄고, 두 손가락 확대(핀치)는 나 탭에서 켜고 끌 수 있어요 (기본: 끔)
    // 📱 앱(아이폰·안드로이드)으로 열렸는지 알아내요 → 앱 안에서는 "앱으로 설치하는 법" 안내를 숨겨요
    (function () {
      var app = false;
      try {
        var C = window.Capacitor;
        if (C && (C.isNativePlatform ? C.isNativePlatform() : C.platform && C.platform !== "web")) app = true;
        if ((document.referrer || "").indexOf("android-app://") === 0) app = true;
        if (app) sessionStorage.setItem("zone.inApp", "1");
        else if (sessionStorage.getItem("zone.inApp") === "1") app = true;
      } catch (e) {}
      window.ZONE_IN_APP = app;
      if (app) document.documentElement.classList.add("in-app");
    })();
    (function () {
      var on = false;
      try { on = localStorage.getItem("training.zoom") === "1"; } catch (e) {}
      function apply() {
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute("content", on ? "width=device-width, initial-scale=1, viewport-fit=cover" : "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
      }
      apply();
      // 아이폰은 user-scalable=no를 무시할 때가 있어서, 끈 상태면 두 손가락 동작도 막아요
      document.addEventListener("gesturestart", function (e) { if (!on) e.preventDefault(); }, { passive: false });
      document.addEventListener("touchmove", function (e) { if (!on && e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
      // 📲 앱 설치: 갤럭시(안드로이드)는 설치 버튼, 아이폰은 '홈 화면에 추가' 안내
      var deferred = null;
      window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
      if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
      window.ZONE_INSTALL = function () {
        var ua = navigator.userAgent, standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
        if (standalone) { alert("이미 앱으로 설치되어 있어요 👍"); return; }
        if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; }); return; }
        if (/iPhone|iPad|iPod/.test(ua)) alert("아이폰에 설치하는 법\n\n1. 사파리로 이 사이트를 열어요 (카톡·네이버 앱 안에서는 안 돼요)\n2. 아래 가운데 공유 버튼(□↑)을 눌러요\n3. '홈 화면에 추가'를 누르고 '추가'\n\n홈 화면의 ZONE 아이콘으로 열면 앱처럼 써요.");
        else if (/SamsungBrowser/.test(ua)) alert("갤럭시(삼성 인터넷)에 설치하는 법\n\n1. 아래 오른쪽 ☰ 메뉴를 눌러요\n2. '현재 페이지 추가' → '홈 화면'\n\n홈 화면의 ZONE 아이콘으로 열면 앱처럼 써요.");
        else if (/Android/.test(ua)) alert("갤럭시(크롬)에 설치하는 법\n\n1. 오른쪽 위 ⋮ 메뉴를 눌러요\n2. '앱 설치' 또는 '홈 화면에 추가'\n\n홈 화면의 ZONE 아이콘으로 열면 앱처럼 써요.");
        else alert("휴대폰에서 이 사이트를 열고 '홈 화면에 추가'를 하면 앱처럼 쓸 수 있어요.\n(아이폰: 사파리 공유 버튼 · 갤럭시: 크롬 ⋮ 메뉴)");
      };
      window.ZONE_ZOOM = { get: function () { return on; }, set: function (v) { on = !!v; try { localStorage.setItem("training.zoom", on ? "1" : "0"); } catch (e) {} apply(); } };
    })();
  </script>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px); /* 📱 시계·배터리·카메라 영역 높이 (휴대폰마다 달라요) */
      color-scheme: light;
      --bg: #f4f7fc;
      --panel: #ffffff;
      --panel2: #eef3fb;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --hover: #c7d2fe;
      --accent: #1d6bf3;
      --accent2: #38bdf8;
      --accent-soft: rgba(29, 107, 243, .10);
      --shadow: rgba(29, 107, 243, .30);
      --done: #16a34a;
      --danger: #e11d48;
      --today: rgba(29, 107, 243, .05);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; } /* 두 번 탭해도 화면이 커지지 않게 */
    /* 📱 스크롤바는 숨겨요 (스크롤은 그대로 돼요) — 스크롤바 자리만큼 화면이 왼쪽으로 밀리지 않게 */
    html, body, * { scrollbar-width: none; -ms-overflow-style: none; } *::-webkit-scrollbar { display: none; width: 0; height: 0; }
    button, a, input, select, textarea, label { touch-action: manipulation; }
    .in-app .zone-install { display: none !important; }
    body { font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; -webkit-tap-highlight-color: transparent; }
    /* 🔒 앱 안의 글·기록은 복사하지 못하게 (길게 눌러도 선택·복사 메뉴가 안 떠요). 입력칸에는 다른 곳에서 복사한 글을 붙여넣을 수 있어요 */
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    /* 👆 손가락으로 누르기 쉽게: 작은 버튼·체크박스 최소 크기 (마지막 점검) */
    .pill { min-height: 32px; }
    input[type="checkbox"] { width: 20px; height: 20px; flex: none; }
    .day-head > button { min-width: 34px; min-height: 32px; }
    .mini-seg > button, .sw { min-height: 34px; }
    [data-racerm] { min-width: 36px; min-height: 36px; }
    .num { font-family: "Barlow Condensed", "Noto Sans KR", sans-serif; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
    .app { max-width: 640px; margin: 0 auto; padding: var(--safe-top) 16px calc(100px + env(safe-area-inset-bottom)); } /* 📱 위쪽 카메라·시계 영역 피하기 */
    .tab { display: none; }
    .tab.show { display: block; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 16px 14px; margin: 0 -16px;
      position: sticky; top: var(--safe-top); z-index: 30; background: var(--bg); } /* 📌 화면 맨 위 제목줄(ZONE)이 기준선 — 스크롤해도 이 위로 글자가 안 올라가요 */
    body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--safe-top); background: var(--bg); z-index: 65; pointer-events: none; } /* 📱 시계·배터리 영역은 항상 비워 둬요 */
    .brand { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-style: italic; font-size: 32px; letter-spacing: 3px; }
    .brand i { color: var(--accent); font-style: italic; }
    h1.big { font-size: 26px; font-weight: 900; margin: 0; letter-spacing: -.5px; white-space: nowrap; flex: none; } /* 제목은 한 줄로 */
    .top > div { flex-wrap: wrap; justify-content: flex-end; } .top .pill { font-size: 12.5px; padding: 6px 10px; }
    .summary .stat b { white-space: nowrap; font-size: clamp(17px, 5.2vw, 26px); } /* "32시간 30분"이 줄바꿈되지 않게 */
    .view-acts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 14px; } /* 수정 · 컨디션 맞춤 · 완료 같은 크기로 */
    .view-acts button { padding: 12px 6px; border-radius: 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .sched-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 10px; } .sched-tools .pill { padding: 10px; font-size: 14px; }
    dialog.wide-dlg { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border: 0; border-radius: 0; padding: var(--safe-top) 0 env(safe-area-inset-bottom); display: flex; flex-direction: column; }
    dialog.wide-dlg:not([open]) { display: none; }
    dialog.wide-dlg[open] { max-height: 100dvh; height: 100dvh; } /* 한눈에 보기는 화면 가득 */
    .wide-hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); } .wide-hd b { font-size: 16px; } .wide-hd .hint { flex: 1; font-size: 12px; }
    .wide-x { background: none; border: 0; font-size: 22px; padding: 4px 8px; cursor: pointer; color: var(--text); }
    .wide-body { overflow-y: auto; padding: 8px 12px 16px; display: grid; gap: 6px; }
    .wide-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: start; padding: 6px 4px; border-bottom: 1px solid var(--line); } .wide-row.today { background: var(--panel2); border-radius: 8px; }
    .wide-day { font-weight: 800; font-size: 13px; } .wide-items { display: grid; gap: 4px; min-width: 0; }
    .wide-it { border-left: 4px solid; padding: 3px 8px; font-size: 13px; border-radius: 4px; background: var(--panel2); overflow-wrap: anywhere; } .wide-it.dn { opacity: .55; text-decoration: line-through; }
    .coach-hd { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
    .coach-title { display: flex; align-items: center; justify-content: space-between; } .coach-title b { font-size: 16px; }
    .coach-again { justify-self: center; margin: 4px 0 8px; padding: 9px 18px; font-weight: 800; }
    .coach-x { background: none; border: 0; font-size: 22px; line-height: 1; padding: 2px 6px; cursor: pointer; color: var(--text); } /* ✕ 는 오른쪽 위 */
    .coach-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .coach-tools button { padding: 8px 4px; border-radius: 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
    .coach-tools button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .q-grp { display: grid; gap: 6px; padding: 6px 0 10px; border-bottom: 1px solid var(--line); } .q-h b { font-size: 14px; }
    .q-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    .q-it { text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 13px; line-height: 1.35; }
    .top-slim { padding: 10px 16px 6px; justify-content: flex-end; } /* 활동: 제목 없이 버튼만 */
    .act-go { margin: 0; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 14px; }
    #tab-plan, #tab-community, #tab-me { padding-top: 12px; } /* 제목을 없앤 탭은 위 여백만 살짝 */
    .view-tools { display: inline-flex; align-items: center; gap: 4px; }
    .view-tools button[data-v="share"], .view-tools button[data-v="big"] { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; width: 36px; height: 32px; padding: 0; font-size: 15px; }
    .big-body { font-size: 15.5px; } .big-open { margin: 8px 0 4px; font-size: 13px; }
    /* 커뮤니티: 전체·친구·인기·저장 + ➕친구 + 🖼️ 를 같은 높이·한 줄로 */
    .tag-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } /* 사진·글 올리기: # 버튼 작게, 3줄 맞춤 */
    .tag-grid .chip { margin: 0; padding: 6px 4px; font-size: 12.5px; border-radius: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .com-top { display: flex; justify-content: flex-end; gap: 6px; margin: 0 0 6px; }
    .com-top .pill { margin: 0; padding: 6px 10px; font-size: 12.5px; border-radius: 999px; }
    .com-bar { display: flex; gap: 8px; margin: 4px 0 10px; align-items: stretch; position: relative; }
    .scope-pick { flex: 1; position: relative; }
    .scope-pick > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; height: 100%; box-sizing: border-box; padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 14px; cursor: pointer; }
    .scope-pick > summary::-webkit-details-marker { display: none; }
    .scope-pick[open] > summary i { transform: rotate(180deg); }
    .scope-menu { position: absolute; left: 0; width: calc(100vw - 32px); max-width: 420px; box-sizing: border-box; top: calc(100% + 4px); z-index: 20; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(15,23,42,.18); }
    .scope-menu button { margin: 0; padding: 12px 6px; font-size: 14px; border-radius: 10px; white-space: nowrap; }
    .scope-menu button.on { background: var(--accent-soft); color: var(--accent); font-weight: 800; border-color: var(--accent); }
    .com-bar .com-w { flex: none; margin: 0; padding: 0 14px; background: var(--accent); color: #fff; border: 0; border-radius: 12px; font-weight: 800; font-size: 13.5px; }
    .hot-p { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 8px; padding: 3px; }
    .hot-p button { padding: 6px 0; font-size: 12.5px; }
    .hot-champ { display: grid; gap: 4px; padding: 10px 12px; }
    .hc-row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 5px 2px; margin: 0; text-align: left; font: inherit; color: inherit; border-top: 1px solid var(--line, #e5e7eb); cursor: pointer; }
    .hc-row:disabled { cursor: default; opacity: .75; }
    .hc-k { width: 62px; font-size: 13px; font-weight: 700; }
    .hc-n { margin-left: auto; font-weight: 800; font-size: 13px; }
    .wbox summary { cursor: pointer; }
    .wb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
    .wb { display: grid; justify-items: center; gap: 1px; padding: 8px 4px; border-radius: 12px; background: #f1f5f9; color: #94a3b8; text-align: center; font-size: 12.5px; }
    .wb .wb-i { font-size: 22px; filter: grayscale(1); opacity: .5; }
    .wb.got { background: #e8f0ff; color: #1d4ed8; } .wb.got .wb-i { filter: none; opacity: 1; }
    .wb small { font-size: 11px; }
    .act-start { width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; margin: 0 0 12px; }
    h2 { font-size: 22px; margin: 0 0 6px; }

    button {
      font: inherit; font-size: 16px; color: var(--text); background: var(--panel2); /* 16px 미만이면 아이폰이 입력할 때 화면을 확대해요 */ border: 1px solid var(--line);
      border-radius: 12px; padding: 9px 14px; cursor: pointer;
    }
    button:hover { border-color: var(--hover); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button.primary:hover { background: #1559d6; }
    button.white { background: var(--text); border-color: var(--text); color: #fff; font-weight: 800; }
    button.danger { color: var(--danger); }
    button.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; }
    .pill { border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; }
    .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cmsg { max-width: 85%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
    .cmsg.me { justify-self: end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .cmsg.ai { justify-self: start; background: var(--soft, #eef2f7); border-bottom-left-radius: 4px; }
    .coach-card { background: linear-gradient(135deg, rgba(29,107,243,.07), rgba(56,189,248,.07)); }
    .icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; }
    input, select, textarea {
      font: inherit; font-size: 16px; color: var(--text); background: var(--panel2); /* 16px 미만이면 아이폰이 입력할 때 화면을 확대해요 */
      border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%;

    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    input[type="range"] { padding: 0; accent-color: var(--accent); background: none; border: 0; }
    label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }

    .card h3 { margin: 0 0 10px; font-size: 15px; }
    .eyebrow { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .4px; margin-bottom: 6px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; line-height: 1.6; }
    .warn { color: var(--danger); font-size: 14px; min-height: 1em; }

    .mt { margin-top: 16px !important; }
    .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; }

    /* ---- 하단 탭 ---- */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: rgba(255, 255, 255, .95); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; align-items: flex-end;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }

      width: 62px; height: 62px; min-width: 0; border-radius: 50%; background: var(--accent); color: #fff;

  <!-- 훈련 일정 추가·수정 -->

  <script>
    // 🔒 창(팝업·전체 화면)이 열려 있는 동안 뒤 화면은 고정 — 안쪽만 스크롤돼요. 모두 닫히면 자동으로 풀려요.
    (function () {
      var locked = false, y = 0, b = document.body;
      function anyOpen() { return !!document.querySelector("dialog[open], .ov.show"); }
      function sync() {
        var want = anyOpen();
        if (want && !locked) {
          locked = true; y = window.scrollY || 0;
          b.style.position = "fixed"; b.style.top = -y + "px"; b.style.left = "0"; b.style.right = "0"; b.style.width = "100%"; b.style.overflow = "hidden";
        } else if (!want && locked) {
          locked = false;
          b.style.position = ""; b.style.top = ""; b.style.left = ""; b.style.right = ""; b.style.width = ""; b.style.overflow = "";
          window.scrollTo(0, y);
        } else if (!want) b.style.overflow = ""; // 예전 방식으로 잠긴 채 남아 있으면 풀기
        else b.style.overflow = "hidden";
      }
      new MutationObserver(function () { sync(); }).observe(b, { subtree: true, attributes: true, attributeFilter: ["class", "open"] });
      window.ZONE_SCROLL = { sync: sync, scrollTo: function (n) { if (locked) y = n; else window.scrollTo(0, n); } };
      sync();
    })();
    try { history.scrollRestoration = "manual"; } catch (e) { /* 앱을 다시 켜면 항상 맨 위에서 시작 */ }
    ["copy", "cut"].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, true); }); // 🔒 앱 안에서는 복사 안 돼요 (붙여넣기는 돼요)
    // 💬 브라우저 기본 알림창 대신 앱 안의 알림창 (앱에서도 똑같이 보이게)
    (function () {
      window.alert = function (msg) {
        var d = document.getElementById("zoneAlert");
        if (!d) { d = document.createElement("dialog"); d.id = "zoneAlert"; document.body.appendChild(d); }
        d.innerHTML = '<div style="padding:20px;display:grid;gap:14px;min-width:240px"><p style="margin:0;font-size:15px;line-height:1.6;white-space:pre-line"></p><button type="button" class="primary">확인</button></div>';
        d.querySelector("p").textContent = String(msg == null ? "" : msg);
        d.querySelector("button").onclick = function () { d.close(); };
        try { if (d.open) d.close(); d.showModal(); } catch (e) { /* 무시 */ }
      };
    })();
    // ✕ 스크롤을 내리면 오른쪽 위에 '닫기' 버튼이 따라다녀요 (모든 팝업·전체 화면)
    (function () {
      var CLOSE = '[data-c="x"]:not(.fx-close),[data-dr="x"],[data-pf="x"],[data-nx="x"],#pvX,#planClose,#tkClose,[aria-label="닫기"]:not(.fx-close)';
      function top() { var all = document.querySelectorAll("dialog[open], .ov.show"); return all.length ? all[all.length - 1] : null; }
      function closer(box) {
        var c = box.querySelector(CLOSE); if (c) return c;
        return [].slice.call(box.querySelectorAll("button:not(.fx-close)")).filter(function (x) { var t = (x.textContent || "").trim(); return t === "✕" || t === "×" || t === "닫기"; })[0] || null;
      }
      function onScroll(e) {
        var box = top(); if (!box || box.id === "trackerOv") return;
        var el = e.target; if (!el || el === document || !(el === box || box.contains(el))) return;
        var fx = el.querySelector(":scope > .fx-close");
        var show = (el.scrollTop || 0) > 120;
        if (show && !fx) {
          fx = document.createElement("button"); fx.type = "button"; fx.className = "fx-close"; fx.setAttribute("aria-label", "닫기"); fx.textContent = "✕";
          fx.onclick = function () { var c = closer(box); if (c) c.click(); else if (box.close) box.close(); else box.classList.remove("show"); };
          el.insertBefore(fx, el.firstChild);
        }
        if (fx) fx.classList.toggle("on", show);
      }
      document.addEventListener("scroll", onScroll, true);
    })();
  </script>
